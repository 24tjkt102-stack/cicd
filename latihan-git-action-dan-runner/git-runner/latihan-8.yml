name: Latihan 8
# Belajar: memakai folder assets/ repo + input manual untuk memilih tujuan
# deploy (staging atau production) di dalam VM yang sama.
on:
  workflow_dispatch:
    inputs:
      tujuan:
        description: 'Deploy ke folder mana?'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Siapkan folder tujuan
        run: sudo mkdir -p /var/www/latihan-8/${{ github.event.inputs.tujuan }}

      - name: Salin logo dari assets/latihan-8 ke folder tujuan
        run: |
          sudo cp assets/latihan-8/logo.svg /var/www/latihan-8/${{ github.event.inputs.tujuan }}/logo.svg
          echo "Dideploy ke: ${{ github.event.inputs.tujuan }}" | sudo tee /var/www/latihan-8/${{ github.event.inputs.tujuan }}/info.txt

      - name: Tampilkan isi folder tujuan sebagai bukti
        run: ls -la /var/www/latihan-8/${{ github.event.inputs.tujuan }}
