name: Latihan 6
# Belajar: perbedaan mendasar self-hosted runner vs GitHub-hosted runner.
# Job ini benar-benar berjalan DI DALAM VM kalian, bukan VM sekali pakai.
on: workflow_dispatch
jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Buktikan job ini jalan di VM sendiri (bukan runner GitHub)
        run: |
          echo "Hostname VM: $(hostname)"
          echo "User yang menjalankan job: $(whoami)"
          echo "Lokasi kerja: $(pwd)"

      - name: Install apache (jika belum ada)
        run: |
          sudo apt update -y
          sudo apt install apache2 -y

      - name: Tes landing page apache
        run: sudo systemctl start apache2 && curl localhost
