name: Latihan 9
# Belajar: trigger pull_request di self-hosted runner untuk membuat preview
# terpisah per nomor PR, tanpa mengganggu isi production.
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'git-runner/latihan-9.yml'
      - 'assets/latihan-9/**'

jobs:
  preview:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Siapkan folder preview khusus PR ini
        run: sudo mkdir -p /var/www/latihan-9/pr-${{ github.event.pull_request.number }}

      - name: Salin halaman preview dari assets/latihan-9
        run: |
          sudo cp assets/latihan-9/preview.html /var/www/latihan-9/pr-${{ github.event.pull_request.number }}/index.html

      - name: Tampilkan lokasi preview yang baru dibuat
        run: |
          echo "Preview PR #${{ github.event.pull_request.number }} tersedia di:"
          echo "/var/www/latihan-9/pr-${{ github.event.pull_request.number }}/index.html"
